<div class="server-error-container">
  <div class="bg-glow"></div>
  
  <div class="error-card" [class.shake]="showErrorMsg">
    <div class="error-badge">
      <mat-icon>dns</mat-icon>
      <span>SERVER OFFLINE</span>
    </div>

    <div class="server-illustration">
      <div class="server-box">
        <div class="server-led red"></div>
        <div class="server-led line"></div>
      </div>
      <div class="server-box offline">
        <div class="server-led red"></div>
        <div class="server-led line"></div>
      </div>
      <div class="server-box">
        <div class="server-led red"></div>
        <div class="server-led line"></div>
      </div>
      
      <div class="glow-alert">500</div>
    </div>

    <h1>Erreur Serveur 500</h1>
    <p class="subtitle">Connexion refusée au serveur backend (ECONNREFUSED)</p>

    <div class="details-panel">
      <mat-icon class="info-icon">warning</mat-icon>
      <div class="details-text">
        <strong>Statut de la connexion :</strong>
        <p>{{ errorText }}</p>
      </div>
    </div>

    <div class="actions">
      <button 
        type="button" 
        class="btn-retry" 
        [disabled]="isChecking"
        (click)="retry()">
        <span class="spinner" *ngIf="isChecking"></span>
        <mat-icon *ngIf="!isChecking">refresh</mat-icon>
        <span>{{ isChecking ? 'Vérification en cours...' : 'Réessayer la connexion' }}</span>
      </button>
    </div>

    <div class="retry-hint" *ngIf="showErrorMsg">
      Le serveur est toujours hors-ligne. Veuillez vérifier que le service backend est bien démarré.
    </div>
  </div>
</div>
