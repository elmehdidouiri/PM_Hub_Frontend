<div class="auth-page min-h-screen bg-slate-100">
  <div class="grid min-h-screen lg:grid-cols-2">
    <section class="flex items-center justify-center bg-white px-6 py-20 sm:px-10 lg:px-16 xl:px-24">
      <div class="w-full max-w-md py-8">
        <div class="inline-flex items-center gap-3 rounded-2xl border border-orange-100 bg-orange-50/70 px-5 py-3.5">
          <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-[#F48009] shadow-sm shadow-orange-200/60">
            <img src="/assets/images/auth/te-connectivity.jpeg" alt="TE Connectivity" class="h-8 w-8 rounded-lg object-cover" />
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.24em] text-[#F48009]">TE Connectivity</p>
            <p class="text-sm text-slate-500">PMHUB</p>
          </div>
        </div>

        <div class="mt-20 space-y-8">
          <h1 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">Sign In</h1>
          <p class="max-w-xl text-base leading-8 text-slate-500">
            Enter your email and password to access PMHUB.
          </p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form mt-24" novalidate>
          <div class="auth-field-group">
            <label for="Email" class="block text-sm font-semibold text-slate-800">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              id="Email"
              type="email"
              formControlName="email"
              placeholder="info@gmail.com"
              class="auth-input block w-full rounded-2xl border border-slate-200 bg-slate-50/70 px-4 py-4 text-sm text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,0.04)] outline-none transition duration-200 placeholder:text-slate-400 hover:border-slate-300 focus:bg-white focus:border-[#F48009] focus:shadow-[0_0_0_4px_rgba(244,128,9,0.12)]"
            />
            <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="mt-2 text-sm text-red-500">
              {{ getErrorMessage('email') }}
            </p>
          </div>

          <div class="auth-field-group">
            <label for="Password" class="block text-sm font-semibold text-slate-800">
              Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <input
                  id="Password"
                  [type]="hidePassword ? 'password' : 'text'"
                  formControlName="password"
                  placeholder="Enter your password"
                class="auth-input block w-full rounded-2xl border border-slate-200 bg-slate-50/70 px-4 py-4 pr-14 text-sm text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,0.04)] outline-none transition duration-200 placeholder:text-slate-400 hover:border-slate-300 focus:bg-white focus:border-[#F48009] focus:shadow-[0_0_0_4px_rgba(244,128,9,0.12)]"
              />
              <button
                type="button"
                (click)="hidePassword = !hidePassword"
                class="absolute inset-y-0 right-0 inline-flex items-center px-4 text-slate-400 transition hover:text-slate-700"
                [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
              >
                @if (hidePassword) {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.63803 3.57709C4.34513 3.2842 3.87026 3.2842 3.57737 3.57709C3.28447 3.86999 3.28447 4.34486 3.57737 4.63775L4.85323 5.91362C3.74609 6.84199 2.89363 8.06395 2.4155 9.45936C2.3615 9.61694 2.3615 9.78801 2.41549 9.94558C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C11.255 15.3619 12.4422 15.0737 13.4994 14.5598L15.3625 16.4229C15.6554 16.7158 16.1302 16.7158 16.4231 16.4229C16.716 16.13 16.716 15.6551 16.4231 15.3622L4.63803 3.57709ZM12.3608 13.4212L10.4475 11.5079C10.3061 11.5423 10.1584 11.5606 10.0064 11.5606H9.99151C8.96527 11.5606 8.13333 10.7286 8.13333 9.70237C8.13333 9.5461 8.15262 9.39434 8.18895 9.24933L5.91885 6.97923C5.03505 7.69015 4.34057 8.62704 3.92328 9.70247C4.86803 12.1373 7.23361 13.8619 10.0002 13.8619C10.8326 13.8619 11.6287 13.7058 12.3608 13.4212ZM16.0771 9.70249C15.7843 10.4569 15.3552 11.1432 14.8199 11.7311L15.8813 12.7925C16.6329 11.9813 17.2187 11.0143 17.5849 9.94561C17.6389 9.78803 17.6389 9.61696 17.5849 9.45938C16.5055 6.30925 13.5184 4.04303 10.0002 4.04303C9.13525 4.04303 8.30244 4.17999 7.52218 4.43338L8.75139 5.66259C9.1556 5.58413 9.57311 5.54303 10.0002 5.54303C12.7667 5.54303 15.1323 7.26768 16.0771 9.70249Z" fill="currentColor"></path>
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10.0002 13.8619C7.23361 13.8619 4.86803 12.1372 3.92328 9.70241C4.86804 7.26761 7.23361 5.54297 10.0002 5.54297C12.7667 5.54297 15.1323 7.26762 16.0771 9.70243C15.1323 12.1372 12.7667 13.8619 10.0002 13.8619ZM10.0002 4.04297C6.48191 4.04297 3.49489 6.30917 2.4155 9.4593C2.3615 9.61687 2.3615 9.78794 2.41549 9.94552C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C13.5184 15.3619 16.5055 13.0957 17.5849 9.94555C17.6389 9.78797 17.6389 9.6169 17.5849 9.45932C16.5055 6.30919 13.5184 4.04297 10.0002 4.04297ZM9.99151 7.84413C8.96527 7.84413 8.13333 8.67606 8.13333 9.70231C8.13333 10.7286 8.96527 11.5605 9.99151 11.5605H10.0064C11.0326 11.5605 11.8646 10.7286 11.8646 9.70231C11.8646 8.67606 11.0326 7.84413 10.0064 7.84413H9.99151Z" fill="currentColor"></path>
                  </svg>
                }
              </button>
            </div>
            <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="mt-2 text-sm text-red-500">
              {{ getErrorMessage('password') }}
            </p>
          </div>

          <div class="auth-inline-row flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between sm:gap-12">
            <label class="inline-flex items-center gap-3 text-sm font-medium text-slate-700">
              <input type="checkbox" class="auth-checkbox h-5 w-5 rounded border-slate-300 text-[#F48009] focus:ring-[#F48009]/30" />
              <span>Keep me logged in</span>
            </label>
            <a routerLink="/auth/forgot-password" class="auth-nav-link text-sm font-medium text-[#F48009] transition-colors hover:text-[#d86d08]">
              Forgot password?
            </a>
          </div>

          <button
            type="submit"
            [disabled]="isLoading"
            class="auth-submit inline-flex w-full items-center justify-center gap-3 rounded-2xl bg-[linear-gradient(135deg,#F48009_0%,#e06f08_100%)] px-4 py-4 text-sm font-semibold text-white shadow-[0_14px_30px_rgba(244,128,9,0.28)] transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_18px_36px_rgba(244,128,9,0.34)] disabled:cursor-not-allowed disabled:opacity-70"
          >
            <span *ngIf="!isLoading">Sign in</span>
            <span *ngIf="isLoading">Signing in...</span>
            <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
          </button>

          <p class="auth-form-footer text-center text-sm leading-7 text-slate-600">
          Don't have an account?
          <a routerLink="/auth/register" class="auth-nav-link font-medium text-[#F48009] transition-colors hover:text-[#d86d08]">
            Sign Up
          </a>
          </p>
        </form>
      </div>
    </section>

    <section class="auth-media-section relative hidden overflow-hidden bg-[#2a1707] lg:flex lg:items-center lg:justify-center">
      <div class="absolute inset-0 opacity-100">
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.08)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.08)_1px,transparent_1px)] bg-[size:52px_52px]"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(244,128,9,0.18),transparent_40%)]"></div>
        <div class="absolute right-20 top-12 h-[52px] w-[52px] bg-white/8"></div>
        <div class="absolute right-32 top-24 h-[52px] w-[52px] bg-[#F48009]/15"></div>
        <div class="absolute bottom-24 left-20 h-[52px] w-[52px] bg-white/8"></div>
        <div class="absolute bottom-12 left-32 h-[52px] w-[52px] bg-[#F48009]/15"></div>
      </div>

      <div class="auth-media-content relative z-10 flex max-w-md flex-col items-center text-center text-white">
        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#F48009] shadow-lg shadow-black/20">
          <img src="/assets/images/auth/te-connectivity.jpeg" alt="TE Connectivity" class="h-10 w-10 rounded-xl object-cover" />
        </div>
        <h2 class="text-5xl font-bold tracking-tight">TE Connectivity</h2>
        <p class="mt-8 text-xl leading-10 text-orange-50/90">
          Project management platform built for teams, planning and delivery.
        </p>
         
      </div>
    </section>
  </div>
</div>
