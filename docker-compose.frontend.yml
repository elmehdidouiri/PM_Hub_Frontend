services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmhub-frontend
    environment:
      NODE_ENV: production
      PORT: 4000
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:4000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pmhub-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
